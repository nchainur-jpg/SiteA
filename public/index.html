<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteA — скоро</title>
  <meta name="description" content="Сайт в разработке">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif'>A</text></svg>">
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #141414;
      --muted: #6b6b6b;
      --accent: #ff5a1f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #f2f2f2; --muted: #9a9a9a; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { max-width: 640px; width: 100%; }
    .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); margin-right: 10px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .3; } }
    .status { font-size: 14px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    h1 { font-size: clamp(40px, 9vw, 72px); line-height: 1; margin: 20px 0 16px; letter-spacing: -.03em; }
    p { font-size: 18px; line-height: 1.5; color: var(--muted); }
    .en { margin-top: 32px; padding-top: 20px; border-top: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>В разработке</div>
    <h1>Скоро здесь будет новый сайт</h1>
    <p>Мы готовим что-то интересное. Загляните чуть позже.</p>
    <p class="en">A new website is coming soon. Stay tuned.</p>
  </main>
</body>
</html>
